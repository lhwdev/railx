name: Build
run-name: Build railx for Forge 1.20.1
on:
  workflow_dispatch: { }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update version
        uses: ./tools/create-release
        with:
          prerelease: true
          prerelease_suffix: build
          auto_increment_type: prerelease
          dry_run: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Build
        run: ./gradlew :forge:build

      - name: Release build artifacts
        uses: ./tools/create-release
        with:
          release_name: RailX {{tag}} for Forge 1.20.1
          body: |
            Automatic build release.
            
            For Minecraft `1.20.1`, Forge `47.1.33+`, Create `6.0.8+`.
          artifacts:
            modules/forge/build/libs/*
          github_token: ${{ secrets.GITHUB_TOKEN }}
